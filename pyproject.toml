[project]
name = "fastapi-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinícius de Paula Moraes", email = "viniciusmoraes295651@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi-pagination>=0.15.16",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "testcontainers[postgres]>=4.15.0",
]

[project.scripts]
fastapi-project = "fastapi_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort — ordena imports
    "UP",   # pyupgrade — moderniza sintaxe
    "B",    # bugbear — bugs comuns
    "SIM",  # simplify
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
